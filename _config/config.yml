---
Name: ecommerce_discount_coupon
Before:
  - '#app'
After:
  - '#coreconfig'
  - '#cmsextensions'
  - '#ecommerce'
---
Sunnysideup\Ecommerce\Cms\StoreAdmin:
  managed_models:
    - Sunnysideup\EcommerceDiscountCoupon\Model\DiscountCouponOption
Sunnysideup\Ecommerce\Control\OrderModifierFormController:
  allowed_actions:
    - DiscountCouponModifier
Sunnysideup\Ecommerce\Pages\Product:
  extensions:
    - Sunnysideup\EcommerceDiscountCoupon\Model\Buyables\DiscountCouponProductDataExtension

Sunnysideup\EcommerceCustomProductLists\Model\CustomProductList:
  belongs_many_many:
    'DiscountCouponOptionsDiscountedProducts': Sunnysideup\EcommerceCustomProductLists\Model\CustomProductList
    'DiscountCouponOptionsMustAlsoBePresentIn': Sunnysideup\EcommerceCustomProductLists\Model\CustomProductList
    'DiscountCouponOptionCustomProductLists': Sunnysideup\EcommerceCustomProductLists\Model\CustomProductList
---
Only:
  classexists: 'DataObjectSorterDOD'
---
PickUpOrDeliveryModifierOptions:
  extensions:
    - DataObjectSorterDOD
